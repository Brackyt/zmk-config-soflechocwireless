# Set the keyboard name
CONFIG_ZMK_KEYBOARD_NAME="HW Sofle Choc"

# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Enables RGB functionality (Uncomment lines below to enable.)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n

# disable "Underglow toggling also controls external power" so that OLED can still run with RGB off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Start with a lower default RGB brightness to save power
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
# Cap max brightness to avoid accidental high draw
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
# Auto turn off RGB when idle or on USB
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# Enter low-power sleep automatically after inactivity (milliseconds)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# External power control (for peripherals like OLED via EP_TOG)
CONFIG_ZMK_EXT_POWER=y

# Prefer the 32.768 kHz crystal for lower power and better timing (nice!nano v2)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y